# Odoo 17 stack for Traefik (no host ports published)
# Uses detected style from existing project: odoo:17 + postgres:16.
# Start after Traefik is running and on the same external proxy network.
# From this folder: docker compose --env-file ../.env up -d

services:
  db17:
    image: ${PG17_IMAGE:-postgres:16}
    container_name: odoo17-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ODOO17_DB_USER:-odoo17}
      POSTGRES_PASSWORD: ${ODOO17_DB_PASSWORD:?Set ODOO17_DB_PASSWORD in ../.env}
      POSTGRES_DB: ${ODOO17_DB_NAME:-postgre}
    volumes:
      # Persistent PostgreSQL data (named volume; survives container recreation)
      - odoo17_db:/var/lib/postgresql/data
    networks:
      - internal17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  odoo17:
    image: ${ODOO17_IMAGE:-odoo:17}
    container_name: odoo17
    depends_on:
      db17:
        condition: service_healthy
    restart: unless-stopped
    command: ["--config=/tmp/odoo.conf"]
    environment:
      HOST: db17
      PORT: "5432"
      USER: ${ODOO17_DB_USER:-odoo17}
      PASSWORD: ${ODOO17_DB_PASSWORD:?Set ODOO17_DB_PASSWORD in ../.env}
      ODOO_ADMIN_PASSWORD: ${ODOO17_ADMIN_PASSWORD:?Set ODOO17_ADMIN_PASSWORD in ../.env}
      # Odoo behind Traefik must trust proxy headers
      ODOO_PROXY_MODE: "True"
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./config:/etc/odoo:ro
      - ./addons:/mnt/extra-addons
      - odoo17_data:/var/lib/odoo
    networks:
      - internal17
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      # HTTPS router (web)
      - "traefik.http.routers.odoo17.rule=Host(`${ODOO17_DOMAIN:-odoo17.devops-odoo.com}`)"
      - "traefik.http.routers.odoo17.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.odoo17.tls=true"
      - "traefik.http.routers.odoo17.tls.certresolver=${CERTSRESOLVER:-le}"
      - "traefik.http.routers.odoo17.service=odoo17"
      - "traefik.http.services.odoo17.loadbalancer.server.port=8069"
      # WebSocket / longpolling
      - "traefik.http.routers.odoo17-ws.rule=Host(`${ODOO17_DOMAIN:-odoo17.devops-odoo.com}`) && PathPrefix(`/websocket`)"
      - "traefik.http.routers.odoo17-ws.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.odoo17-ws.tls=true"
      - "traefik.http.routers.odoo17-ws.tls.certresolver=${CERTSRESOLVER:-le}"
      - "traefik.http.routers.odoo17-ws.priority=100"
      - "traefik.http.routers.odoo17-ws.service=odoo17-ws"
      - "traefik.http.services.odoo17-ws.loadbalancer.server.port=8072"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  internal17:
    name: odoo17_internal
    driver: bridge
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}

volumes:
  odoo17_db:
    name: odoo17_db_data
  odoo17_data:
    name: odoo17_filestore
