services:
  # Traefik Reverse Proxy - minimal setup for local testing
  traefik:
    container_name: traefik
    hostname: traefik
    image: traefik:v3.6.1
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/certs:/certs:ro
      - ./traefik/dynamic:/dynamic:ro
      - ./traefik:/etc/traefik
    networks:
      - proxy
    command:
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"

      # Dynamic file provider
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"

      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"

      # API & Dashboard
      - "--api=true"
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # Observability
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--serversTransport.insecureSkipVerify=true"

      # ACME Let's Encrypt (optional - only if CF_DNS_API_TOKEN is set)
      - "--certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.le.acme.storage=/etc/traefik/acme.json"
      - "--certificatesresolvers.le.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.le.acme.dnschallenge.delaybeforecheck=60"
      - "--entrypoints.websecure.http.tls.certresolver=le"
    labels:
      - "traefik.enable=true"
      # Dashboard HTTP router (local testing)
      - "traefik.http.routers.traefik.rule=Host(`traefik.odoo-com`) || Host(`odoo-com`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"

  # Whoami - test service accessible via http://localhost
  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # HTTP router for odoo-com (no TLS needed)
      - "traefik.http.routers.whoami.rule=Host(`whoami.odoo-com`) || Host(`odoo-com`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.routers.whoami.service=whoami"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

networks:
  proxy:
    driver: bridge

volumes:
  traefik-data:
  whoami-data: